<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5JXPL3GSR7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }

        gtag("js", new Date());
        gtag("config", "G-5JXPL3GSR7");
    </script>

    <title>NoviAI Workspace</title>

    <link rel="stylesheet" href="ai.css">
</head>

<body>

<div class="app-shell">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <span>NoviAI</span>
        </div>

        <button class="new-chat" type="button" onclick="newChat()">
            <span>＋</span>
            New Chat
        </button>

        <nav class="sidebar-nav">

            <button class="nav-item" type="button" onclick="changeMode('Study')">
                <span class="nav-icon">📚</span>
                <span>Study</span>
            </button>

            <button class="nav-item" type="button" onclick="openLearnLoop()">
                <span class="nav-icon">🔄</span>
                <span>LearnLoop</span>
            </button>

            <button class="nav-item" type="button" onclick="changeMode('Create')">
                <span class="nav-icon">📝</span>
                <span>Create</span>
            </button>

            <button class="nav-item active" type="button" onclick="changeMode('Ask')">
                <span class="nav-icon">💡</span>
                <span>Ask Anything</span>
            </button>

            <button class="nav-item" type="button" onclick="changeMode('Support')">
                <span class="nav-icon">💙</span>
                <span>Support</span>
            </button>

        </nav>

        <div class="sidebar-bottom">

            <button class="bottom-item" type="button">
                <span>⚙️</span>
                Settings
            </button>

            <button
                class="bottom-item"
                type="button"
                onclick="goHome()"
            >
                <span>🏠</span>
                Home
            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <div>
                <h1 id="pageTitle">Ask NoviAI</h1>

                <p id="pageSubtitle">
                    Ask questions and get helpful answers.
                </p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>Ready</span>
            </div>

        </header>


        <!-- ================= CHAT ================= -->

        <section class="chat-area" id="chat">

            <div class="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h2>Hello! 👋</h2>

                <p>
                    I'm NoviAI. What can I help you with today?
                </p>

                <div class="quick-actions">

                    <button
                        type="button"
                        onclick="usePrompt('Explain a topic')"
                    >
                        <span>📚</span>
                        Explain a topic
                    </button>

                    <button
                        type="button"
                        onclick="usePrompt('Create a study plan')"
                    >
                        <span>📅</span>
                        Create a study plan
                    </button>

                    <button
                        type="button"
                        onclick="usePrompt('Write a proposal')"
                    >
                        <span>📝</span>
                        Write a proposal
                    </button>

                    <button
                        type="button"
                        onclick="usePrompt('Talk to me')"
                    >
                        <span>💙</span>
                        Talk to me
                    </button>

                    <a
                        href="game.html"
                        class="game-button"
                    >
                        🎮 Chase Game
                    </a>

                </div>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <div class="composer-wrapper">

            <div class="composer">

                <button
                    class="attach-btn"
                    type="button"
                    title="Attach"
                >
                    📎
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Ask NoviAI anything..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    id="sendButton"
                    class="send-btn"
                    type="button"
                    aria-label="Send message"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <p class="disclaimer">
                NoviAI can make mistakes. Check important information.
            </p>

        </div>

    </main>

</div>


<!-- ================= LEARNLOOP MODAL ================= -->

<div
    id="learnLoopModal"
    class="learnloop-modal"
>

    <div class="learnloop-card">

        <button
            class="learnloop-close"
            type="button"
            onclick="closeLearnLoop()"
        >
            ×
        </button>

        <div class="learnloop-icon">
            🔄
        </div>

        <h2>NoviAI LearnLoop</h2>

        <p class="learnloop-subtitle">
            Learn it. Practise it. Master it.
        </p>


        <!-- START -->

        <div id="learnLoopStart">

            <label>
                What do you want to learn?
            </label>

            <input
                id="learnLoopTopic"
                type="text"
                placeholder="Example: Photosynthesis"
            >

            <label>
                Subject
            </label>

            <input
                id="learnLoopSubject"
                type="text"
                placeholder="Example: Biology"
            >

            <label>
                Difficulty
            </label>

            <select id="learnLoopDifficulty">
                <option>Beginner</option>
                <option selected>Intermediate</option>
                <option>Advanced</option>
            </select>

            <button
                class="learnloop-start"
                type="button"
                onclick="startLearnLoop()"
            >
                🚀 Start Learning
            </button>

        </div>


        <!-- LESSON -->

        <div
            id="learnLoopLessonScreen"
            style="display:none;"
        >

            <div
                id="learnLoopLesson"
                class="learnloop-lesson"
            ></div>

            <button
                class="learnloop-start"
                type="button"
                onclick="createLearnLoopQuiz()"
            >
                🧠 I'm Ready — Quiz Me
            </button>

        </div>


        <!-- QUIZ -->

        <div
            id="learnLoopQuizScreen"
            style="display:none;"
        >

            <div id="learnLoopQuestions"></div>

            <button
                class="learnloop-start"
                type="button"
                onclick="submitLearnLoopQuiz()"
            >
                🎯 Submit Answers
            </button>

        </div>


        <!-- RESULT -->

        <div
            id="learnLoopResultScreen"
            style="display:none;"
        >

            <div
                id="learnLoopScore"
                class="learnloop-score"
            ></div>

            <div
                id="learnLoopFeedback"
                class="learnloop-feedback"
            ></div>

            <button
                class="learnloop-start"
                type="button"
                onclick="nextLearnLoopChallenge()"
            >
                🔥 Next Challenge
            </button>

        </div>

    </div>

</div>


<!-- IMPORTANT: LOAD JAVASCRIPT LAST -->

<script src="ai.js"></script>

</body>
</html>
