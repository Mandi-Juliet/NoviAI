<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoviAI Run</title>

    <link rel="stylesheet" href="game.css">
</head>

<body>

<div id="game">

    <!-- CITY BACKGROUND -->
    <div class="sky"></div>

    <div class="city city-back">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="city city-front">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- GAME HEADER -->

    <div class="hud">

        <div class="stat">
            ⭐ <span id="score">0</span>
        </div>

        <div class="game-title">
            ✦ NoviAI Run
        </div>

        <div class="lives">
            <span>❤️</span>
            <span>❤️</span>
            <span>❤️</span>
        </div>

    </div>


    <!-- ROAD -->

    <div class="road">

        <div class="lane lane-left"></div>
        <div class="lane lane-middle"></div>
        <div class="lane lane-right"></div>

        <div class="road-line line1"></div>
        <div class="road-line line2"></div>
        <div class="road-line line3"></div>
        <div class="road-line line4"></div>

    </div>


    <!-- OBJECTS WILL BE CREATED BY JAVASCRIPT -->

    <div id="objects"></div>


    <!-- PLAYER -->

    <div id="player">

        <div class="character">

            <div class="hair"></div>

            <div class="head">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
                <div class="mouth"></div>
            </div>

            <div class="body">
                <div class="logo-star">✦</div>
            </div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>

            <div class="shoe shoe-left"></div>
            <div class="shoe shoe-right"></div>

        </div>

    </div>


    <!-- START SCREEN -->

    <div id="startScreen" class="screen">

        <div class="start-card">

            <div class="big-logo">✦</div>

            <h1>NoviAI Run</h1>

            <p>
                Run through the city.<br>
                Collect coins. Dodge obstacles.
            </p>

            <button id="startButton">
                ▶ START RUN
            </button>

            <div class="controls-help">
                ← → Move &nbsp; ↑ Jump &nbsp; ↓ Slide
            </div>

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver" class="screen hidden">

        <div class="start-card">

            <div class="big-logo">💫</div>

            <h1>Run Over</h1>

            <p>
                Your score:
                <strong id="finalScore">0</strong>
            </p>

            <button id="restartButton">
                🔄 RUN AGAIN
            </button>

        </div>

    </div>


    <!-- MOBILE CONTROLS -->

    <div class="mobile-controls">

        <button id="leftButton">◀</button>

        <button id="jumpButton">▲</button>

        <button id="slideButton">▼</button>

        <button id="rightButton">▶</button>

    </div>


    <div class="tip">
        Collect ⭐ coins and stay alive!
    </div>

</div>


<script src="game.js"></script>

</body>
</html>
