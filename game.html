<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>NoviAI Chase</title>

<link rel="stylesheet" href="game.css">
```

</head>

<body>

```
<div class="game-wrapper">

    <header class="game-header">
        <div class="game-logo">✦ NoviAI Chase</div>

        <div class="score-area">
            <span>⭐ Score</span>
            <strong id="score">0</strong>
        </div>
    </header>

    <main id="game">

        <div class="sky"></div>

        <div class="road">

            <div class="lane lane-left"></div>
            <div class="lane lane-middle"></div>
            <div class="lane lane-right"></div>

            <div id="player" class="player">
                🏃
            </div>

            <div id="objects"></div>

        </div>

        <div id="start-screen" class="screen">

            <div class="game-icon">✦</div>

            <h1>NoviAI Chase</h1>

            <p>
                Run, dodge and collect coins!
            </p>

            <button id="startButton">
                ▶ Start Game
            </button>

            <small>
                Use ← → to move and ↑ to jump
            </small>

        </div>

        <div id="game-over" class="screen hidden">

            <div class="game-icon">💥</div>

            <h1>Game Over</h1>

            <p>Your score</p>

            <strong id="final-score">0</strong>

            <button id="restartButton">
                🔄 Play Again
            </button>

        </div>

    </main>

    <div class="mobile-controls">

        <button id="leftButton">⬅️</button>

        <button id="jumpButton">⬆️</button>

        <button id="rightButton">➡️</button>

    </div>

    <footer>
        ✦ NoviAI Chase • Learn. Create. Play.
    </footer>

</div>

<script src="game.js"></script>
```

</body>
</html>
