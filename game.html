
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoviAI Chase</title>

    <link rel="stylesheet" href="game.css">
</head>

<body>

    <div class="game">

        <header class="game-header">
            <button class="back-btn" onclick="location.href='ai.html'">← NoviAI</button>

            <div class="game-title">
                <span>✦</span> NOVIAI CHASE
            </div>

            <div class="score-box">
                <div>SCORE</div>
                <strong id="score">0</strong>
            </div>
        </header>

        <div class="game-area" id="gameArea">

            <div class="sky"></div>

            <div class="city city-back"></div>
            <div class="city city-front"></div>

            <div class="road">

                <div class="lane-line line1"></div>
                <div class="lane-line line2"></div>

                <div class="lane-marker marker1"></div>
                <div class="lane-marker marker2"></div>

                <div id="coins"></div>
                <div id="obstacles"></div>

                <!-- PLAYER -->
                <div id="player" class="player">

                    <div class="hair"></div>

                    <div class="head"></div>

                    <div class="body">
                        <div class="backpack"></div>
                    </div>

                    <div class="arm arm-left"></div>
                    <div class="arm arm-right"></div>

                    <div class="leg leg-left"></div>
                    <div class="leg leg-right"></div>

                </div>

            </div>

            <div class="start-screen" id="startScreen">

                <div class="game-logo">✦</div>

                <h1>NoviAI Chase</h1>

                <p>
                    Run, dodge and collect coins.
                </p>

                <p class="controls">
                    ← → Move &nbsp; • &nbsp; ↑ Jump &nbsp; • &nbsp; ↓ Slide
                </p>

                <button id="startButton">
                    START RUN
                </button>

            </div>

            <div class="game-over" id="gameOver">

                <div class="game-logo">✦</div>

                <h1>RUN OVER</h1>

                <p>Your score</p>

                <strong id="finalScore">0</strong>

                <button id="restartButton">
                    RUN AGAIN
                </button>

            </div>

            <!-- MOBILE CONTROLS -->

            <div class="mobile-controls">

                <button id="leftButton">←</button>

                <button id="jumpButton">↑</button>

                <button id="slideButton">↓</button>

                <button id="rightButton">→</button>

            </div>

        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
