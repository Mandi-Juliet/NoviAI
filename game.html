<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoviAI Chase</title>

    <link rel="stylesheet" href="game.css">
</head>

<body>

<div class="game">

    <!-- TOP HUD -->
    <div class="hud">

        <div class="hud-left">

            <div class="hud-box">
                ⭐ <span id="score">0</span>
            </div>

            <div class="hud-box">
                🪙 <span id="coins">0</span>
            </div>

        </div>

        <div class="game-title">
            ✦ NoviAI Chase
        </div>

        <div class="hud-right">

            <div class="hearts">
                ❤️ ❤️ ❤️
            </div>

        </div>

    </div>


    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>


    <!-- START SCREEN -->
    <div id="startScreen" class="overlay">

        <div class="logo-big">
            ✦
        </div>

        <h1>NoviAI Chase</h1>

        <p>
            Run • Dodge • Collect • Survive
        </p>

        <button id="startBtn">
            ▶ START GAME
        </button>

        <div class="instructions">
            <div>⬅️ ➡️ Move</div>
            <div>⬆️ Jump</div>
            <div>⬇️ Slide</div>
        </div>

    </div>


    <!-- GAME OVER -->
    <div id="gameOverScreen" class="overlay hidden">

        <div class="game-over-icon">
            💥
        </div>

        <h1>Game Over</h1>

        <p>Your Score</p>

        <div id="finalScore">
            0
        </div>

        <button id="restartBtn">
            🔄 PLAY AGAIN
        </button>

    </div>


    <!-- MOBILE CONTROLS -->
    <div class="controls">

        <button id="leftBtn">
            ◀
        </button>

        <button id="jumpBtn">
            ▲
        </button>

        <button id="slideBtn">
            ▼
        </button>

        <button id="rightBtn">
            ▶
        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
